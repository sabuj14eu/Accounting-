name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  isolation:
    name: Isolation from trading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This job exists to fail loudly. The isolation requirement is violated by
      # ADDING something, at any time, in any file — so it is checked on every
      # push rather than reviewed once and trusted afterwards.
      - run: bin/check-isolation.sh

  shop-intelligence:
    name: Shop Intelligence (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      # The second application. Its own tests, its own isolation guard, and
      # neither may touch the accounting module or the trading system.
      - name: Isolation guard (10 checks, 0 violations required)
        working-directory: shop-intelligence
        run: ./bin/check-shop-isolation.sh
      - name: Install PHPUnit
        working-directory: shop-intelligence
        run: composer install --no-interaction --prefer-dist
      - name: Test
        working-directory: shop-intelligence
        run: vendor/bin/phpunit -c phpunit.xml
      - name: The analysis core runs without a framework or a database
        working-directory: shop-intelligence
        run: php bin/shop-demo | grep -q 'MANAGEMENT ANALYSIS'

  tests:
    name: Poland tax engine (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, dom, xml
          coverage: none
      - name: Install
        working-directory: modules/poland
        run: composer install --no-interaction --prefer-dist
      - name: Test
        working-directory: modules/poland
        run: vendor/bin/phpunit
      - name: Lint every source file
        working-directory: modules/poland
        run: find src config bin database -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Standalone CLI runs without a framework
        working-directory: modules/poland
        run: ./bin/pl-tax --profile=examples/profile.json --sales-file=examples/sales-2026.json --period=2026-08 --brief

  rate-coverage:
    name: Rate tables still cover the coming months
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Rate tables run out. This is the check that says so before a taxpayer
      # hits a month the software cannot price.
      - name: Check coverage six months ahead
        working-directory: modules/poland
        run: |
          php -r '
            require "autoload.php";
            $rates = Poland\Rates\RateRepository::default();
            $period = Poland\Domain\Period::of((int) date("Y"), (int) date("n"));
            $failed = false;
            for ($i = 0; $i < 6; $i++) {
                $coverage = $rates->coverage($period);
                printf("%s %s%s\n", $period->toString(), $coverage["ok"] ? "OK" : "BRAK",
                    $coverage["ok"] ? "" : " -> " . implode(", ", $coverage["missing"]));
                $failed = $failed || ! $coverage["ok"];
                $period = $period->next();
            }
            exit($failed ? 1 : 0);
          '

  laravel-integration:
    name: Liberu boots, migrates and runs the module (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, dom, xml, sqlite3, pdo_sqlite, curl, zip, gd, bcmath
          coverage: none

      # The point of this job: the module's Laravel layer is not "written", it
      # RUNS. Provider discovery, migrations, models, the recorder, the console
      # commands and the HTTP route are all exercised against the real ERP.
      - name: Install the foundation and mount the module
        run: app/bin/install-foundation.sh "$GITHUB_WORKSPACE/foundation"

      - name: Configure SQLite
        working-directory: foundation
        run: |
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$GITHUB_WORKSPACE/foundation/database/database.sqlite|" .env
          mkdir -p database && touch database/database.sqlite
          php artisan key:generate --force

      - name: Index names fit the database identifier limit
        run: app/bin/patch-foundation-index-names.sh "$GITHUB_WORKSPACE/foundation" --check

      - name: Migrate
        working-directory: foundation
        run: php artisan migrate --force

      - name: The module's tables exist
        working-directory: foundation
        run: |
          for t in pl_tax_profiles pl_sales_reports pl_settlements pl_audit_events pl_prepared_documents; do
            php artisan migrate:status | grep -q poland || true
            sqlite3 database/database.sqlite ".tables" | grep -q "$t" \
              || { echo "missing table $t"; exit 1; }
          done

      - name: Commands are registered and run
        working-directory: foundation
        run: |
          php artisan list | grep -q 'poland:report'
          php artisan list | grep -q 'poland:verify-rates'
          php artisan poland:verify-rates --months=3

      - name: Routes are registered
        working-directory: foundation
        run: php artisan route:list | grep -q 'poland.dashboard'

      # Rates are still sourced from secondary publications. This asserts the
      # engine SAYS so rather than asserting that they are fine.
      - name: Unverified rates are reported, not hidden
        working-directory: foundation
        run: |
          if php artisan poland:rate-provenance --todo; then
            echo "Every rate is marked official. Update docs/OPEN_ITEMS.md and this job."
            exit 1
          fi
          echo "Unverified rates correctly reported."
