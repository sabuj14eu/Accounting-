# Shop Profit Intelligence — shop.signalmesh.dev
#
# Its own server block, its own PHP-FPM pool, its own root, its own logs.
# Nothing here proxies to, or shares an upstream, a socket or a cookie domain
# with account.signalmesh.dev or with the trading platform. If this vhost is
# down neither of them notices; if either of them is down this still serves.
#
# Until the application is built (see docs/SPEC_AUDIT_2026-09-08.md §4) the
# document root holds a single static page that says exactly that. The PHP
# location is present so that enabling the application later is a root change,
# not a vhost rewrite — and it is harmless while no .php file exists.

server {
    listen 80;
    listen [::]:80;
    server_name shop.signalmesh.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.signalmesh.dev;

    ssl_certificate     /etc/letsencrypt/live/shop.signalmesh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.signalmesh.dev/privkey.pem;

    root /srv/shop-intelligence/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;          # bank statements, platform statements, scanned invoices

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/shop-intelligence.access.log;
    error_log  /var/log/nginx/shop-intelligence.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Its own pool. Never php8.5-fpm-accounting.sock and never the trading
        # platform's pool: a shared pool is a shared outage.
        fastcgi_pass unix:/run/php/php8.5-fpm-shop.sock;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
