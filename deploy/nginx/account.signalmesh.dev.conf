# Accounting application — account.signalmesh.dev
#
# A SEPARATE server block, a separate PHP-FPM pool and a separate root from the
# trading platform. Nothing here proxies to, or shares an upstream with,
# app.signalmesh.dev: if this vhost is down the trading platform does not
# notice, and if the trading platform is down accounting still serves.

server {
    listen 80;
    listen [::]:80;
    server_name account.signalmesh.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name account.signalmesh.dev;

    ssl_certificate     /etc/letsencrypt/live/account.signalmesh.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/account.signalmesh.dev/privkey.pem;

    root /srv/accounting/foundation/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;          # scanned invoices and KSeF XML

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/accounting.access.log;
    error_log  /var/log/nginx/accounting.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Its own pool. Sharing the trading platform's pool would let an
        # accounting request exhaust the workers that serve the dashboard.
        fastcgi_pass unix:/run/php/php8.5-fpm-accounting.sock;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
